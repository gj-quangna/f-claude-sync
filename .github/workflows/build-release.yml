name: Build & Release

# Fork release pipeline: pushing a tag v* that points at a commit on branch
# `me` builds the Linux binaries and publishes a GitHub Release.
# Tag filters cannot match on branch, so the `verify` job enforces it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must be reachable from `me` and not from `main` (the upstream mirror),
      # so upstream tags pushed to this repo never trigger a release.
      - name: Check tag is on branch me
        run: |
          git fetch --no-tags origin me main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/me; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on branch me"
            exit 1
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is on main (upstream mirror), not a fork release"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Linux only to keep release builds fast. Uncomment to ship more OSes.
        include:
          # - goos: windows
          #   goarch: amd64
          #   ext: .exe
          # - goos: windows
          #   goarch: arm64
          #   ext: .exe
          # - goos: darwin
          #   goarch: amd64
          #   ext: ""
          # - goos: darwin
          #   goarch: arm64
          #   ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o claude-sync-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/claude-sync
      - uses: actions/upload-artifact@v4
        with:
          name: claude-sync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: claude-sync-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum claude-sync-* > checksums.txt
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "claude-sync $GITHUB_REF_NAME" \
            --generate-notes \
            claude-sync-* checksums.txt
